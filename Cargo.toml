[workspace]
members = ["crates/superb-core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/kihea/superb"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
proptest = "1"
serde_json = "1"
toml = "0.8"
syn = { version = "2", features = ["full"] }
