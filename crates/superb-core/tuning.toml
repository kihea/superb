# Every constant the science calls a tendency rather than a law
# (engine-contract §3). Named honestly, even though the app's interface never
# speaks any of them. The simulator can override this file at runtime;
# nothing else in the product can — see engine-contract §3 and ADR-015.
#
# Every number here is provisional until the simulator has run (ADR-015).
# Changing one on the evidence of a single reader is a CHECKPOINT
# (workspace/contract.md); changing one on simulator output is ordinary work.

# --- Composer scoring (ADR-015) ---

# How fast a passage's later due words lose value: the i-th most valuable due
# word in a passage is worth coverage_decay^(i-1) of the first. Keeps a
# six-word passage from beating a well-chosen two-word one just by density.
coverage_decay = 0.75

# Multiplies a sourced excerpt's total score against a composed passage's.
# The one number that carries the "shine light on literature" answer
# (ADR-015), separate from the affinity table below on purpose.
sourced_preference = 2.4

# The fewest due words a sourced excerpt must cover in informative context
# before it is even a candidate. Below this, a sourced hit is decoration and
# must not bump a word out of a scheduled encounter.
min_sourced_coverage = 2

# --- Encounter target: how many varied contexts carry a word to automatic ---

# The number of varied-context encounters the schedule aims a word toward
# before it is treated as understood without deliberate retrieval.
encounter_target = 10

# The fewest encounters that can still count as having demonstrated mastery.
encounter_target_min = 6

# The most encounters a word is scheduled for before the schedule gives up on
# adding more value by repetition alone.
encounter_target_max = 20

# How many distinct-context clean encounters move a word from Learning to
# Consolidating — the earlier of the schedule's two progression edges;
# encounter_target is the later one, for Consolidating -> Automatic
# (src/engine.rs's ARCHITECT'S ANSWER, BRIEF-013 round 2). Counted in
# distinct context frames, never raw encounters, for the same reason
# encounter_target is: ten meetings inside one passage must not promote a
# word that has only ever been understood in one sentence.
consolidating_threshold = 4

# --- θ band (engine-contract §4): which due words are worth serving now ---

# How far below the learner's estimated ability a word may sit and still be
# worth serving — reinforcement of what is nearly automatic.
band_low = -0.2

# How far above the learner's estimated ability a word may sit and still be
# worth serving — stretch that is still readable in context.
band_high = 0.6

# How far the online ability estimate steps toward a single encounter's
# residual, as a fraction of it. Slow enough that one lucky swipe does not
# move the θ band under the learner's feet; fast enough to converge inside a
# twenty-item deck.
theta_update_rate = 0.15

# The symmetric logit range θ is clamped to (BRIEF-010). ±4.0 is the
# conventional bound for a one-parameter logistic ability scale — past it, a
# claim stops being informative, so nothing is lost by refusing to track it
# further in either direction.
theta_min = -4.0
theta_max = 4.0

# How far a single pseudoword over-claim steps θ down, baked into the same
# per-observation update the ordinary evidence goes through (BRIEF-010's
# pseudoword correction) rather than a second event a caller could forget to
# send. Buys: a learner who claims to know words that do not exist gets
# their estimate corrected downward instead of flattered.
pseudoword_penalty = 0.3

# --- Backlog override (ADR-015): when coverage must beat taste ---

# How many due words waiting before the composer stops choosing for taste
# and starts choosing for coverage — the guard that makes the bounded-due-
# list assertion provable.
backlog_override_due = 40

# How many days a word may sit due before waiting for a better passage stops
# paying for itself — the spacing benefit it protected is already spent.
backlog_override_age_days = 7

# --- Signal reliability guards (engine-contract §3) ---

# Standard deviations from a word's own dwell distribution before a slow
# read counts as evidence rather than noise. Dwell is a weak signal,
# attributed only on single-target screens.
dwell_anomaly_z = 2.0

# The most probes — the strongest positive signal, and the most intrusive
# thing the app does — the schedule will spend in one session before
# reading starts to feel like testing.
probe_frequency_cap = 3

# --- Signal ranking (BRIEF-011): how much each event's evidence is worth ---
# The engine's whole vocabulary of evidence, in three numbers. The ordering
# — probe > negative_strong > dwell_negative > 0 — is enforced by
# Tuning::validate, not merely by these values, so no legal edit to this
# file can invert it (engine-contract §1 law 6).

# How strongly a correctly assembled probe counts as evidence the reader
# knows the word. The strongest positive signal the schedule ever reads.
signal_strength_probe_positive = 3.0

# How strongly a gloss tap, or a failed probe, counts as evidence the word
# is not yet automatic. Shared by both, on purpose: "the reader tapped the
# gloss, or a probe failed" is one sentence in engine-contract §3, and this
# is why — asking for help mid-read and failing an assembly are the same
# admission, made two different ways. The strongest negative signal.
signal_strength_negative_strong = 2.0

# How strongly a slow read counts as evidence, on the rare screen where it
# can be pinned to exactly one word. Deliberately the weakest of the three:
# it is inferred from timing, never an explicit admission the way a gloss
# tap or a failed probe is.
signal_strength_dwell_negative = 0.5

# --- Interval multipliers: the schedule is the pedagogy ---

# The first interval, in days, after a word leaves Unseen.
interval_initial_days = 1.0

# Multiplier on a clean pass while a word is in Learning.
interval_learning = 2.0

# Multiplier on a clean pass while a word is Consolidating — slightly wider,
# the word is mostly known.
interval_consolidating = 2.5

# Multiplier on a clean pass while a word is Automatic — widest, since an
# encounter here is confirmation rather than teaching.
interval_automatic = 3.0

# Multiplier applied on a lapse, never a reset to the initial interval — a
# lapsed word is not an unknown word, so the schedule should lose ground,
# not all of it.
interval_lapse = 0.4

# The longest interval the schedule will ever set. Past six months an
# interval is a guess, not a prediction.
interval_max_days = 180.0

# --- State-by-pool affinity (ADR-015, ADR-009's judgment made numeric) ---
# How much a word in this state is worth meeting in this pool. A word met
# early is served by a context built to teach; a word nearing automaticity is
# served by meeting it in the wild.

[affinity.seeded]
composed = 1.0
sourced = 0.5

[affinity.learning]
composed = 1.0
sourced = 0.7

[affinity.consolidating]
composed = 0.8
sourced = 1.3

[affinity.automatic]
composed = 0.5
sourced = 1.5
