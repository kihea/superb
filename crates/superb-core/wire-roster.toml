# The roster of every type in superb-core carrying Serialize, Deserialize,
# PartialOrd, or Ord (ADR-016 D3, D4). A serde or ordering derive — or a
# hand-written impl of one of these traits — on a type not listed here does
# not land — tests/wire_roster.rs enforces this by parsing every .rs file
# under src/ and asserting the two agree exactly.
#
# `tier` is `durable` (reachable from the persisted root `LearnerState`,
# authorized by an ADR) or `boundary` (crosses FFI or lands in a committed
# fixture, never persisted, authorized by the brief that introduces it).
# `LearnerState` landed in BRIEF-008; the durable tier is no longer empty.

[[type]]
name = "WordState"
tier = "durable"
derives = ["Serialize", "Deserialize", "PartialOrd", "Ord"]
consumer = "golden-vector alphabet; crosses WASM, JNI and Swift FFI; a field of WordRecord inside LearnerState"
authorized_by = "BRIEF-001, ADR-016 D4"
note = "durable as of BRIEF-008 — reachable from LearnerState, inside the frozen v1 fixture"

[[type]]
name = "Timestamp"
tier = "durable"
derives = ["Serialize", "Deserialize"]
consumer = "WordRecord.due, inside LearnerState"
authorized_by = "ADR-016, BRIEF-008"

[[type]]
name = "WordRecord"
tier = "durable"
derives = ["Serialize", "Deserialize"]
consumer = "LearnerState.words, the per-word record"
authorized_by = "ADR-016, BRIEF-008"

[[type]]
name = "LearnerState"
tier = "durable"
derives = ["Serialize", "Deserialize"]
consumer = "the persisted root itself (engine-contract §1.5); read by LearnerState::load and written by LearnerState::to_document"
authorized_by = "ADR-016, BRIEF-008"

[[type]]
name = "EnvelopeV1"
tier = "durable"
derives = ["Serialize"]
consumer = "LearnerState::to_document — pins v as the document's first key on write (ADR-016 D1). load never deserializes through it; see the loader's own doc comment"
authorized_by = "ADR-016, BRIEF-008"

[[type]]
name = "Transition"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "engine-contract §5 golden vectors; the event stream in"
authorized_by = "BRIEF-001, ADR-016 D4"

[[type]]
name = "WordStateChanged"
tier = "boundary"
derives = ["Serialize"]
consumer = "the expected side of a golden vector; the host persists effects (engine-contract §3)"
authorized_by = "BRIEF-001, ADR-016 D4"

[[type]]
name = "Tuning"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "the simulator overrides tuning.toml wholesale (engine-contract §3); Deserialize also parses the shipped file and Serialize backs the round-trip stability test"
authorized_by = "BRIEF-007"
note = "not reachable from LearnerState; carries no migration obligation"

[[type]]
name = "Affinity"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "nested inside Tuning; same simulator-override and round-trip-test consumer"
authorized_by = "BRIEF-007"
note = "not reachable from LearnerState; carries no migration obligation"

[[type]]
name = "PoolAffinity"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "nested inside Affinity; same simulator-override and round-trip-test consumer"
authorized_by = "BRIEF-007"
note = "not reachable from LearnerState; carries no migration obligation"
