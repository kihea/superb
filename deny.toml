# Makes CLAUDE.md law 5 — no GPL anywhere in the dependency tree — a CI job
# instead of a sentence. Run as `cargo deny check licenses bans sources`
# (core.yml), which covers the whole graph, dev-dependencies included; that
# is wider than the runtime-purity assertion in `tests/wire_roster.rs`, which
# is about the shipped library only. Two rules, two scopes, on purpose.

[graph]
all-features = true

[licenses]
# This list is about what the project will CONSUME. It is not the
# project's own outbound licence, which is MIT + Commons Clause per
# ADR-025 and stays permissive-compatible: MIT and Apache-2.0
# dependencies are consumable by a source-available product.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]

# Superb's own crates carry `license-file` rather than an SPDX `license`
# expression, because the Commons Clause has no SPDX identifier (ADR-025).
# They are unpublished, so this skips them here and nowhere else — the
# allow list above still governs every dependency, dev-dependencies
# included, which is what law 5 actually needs.
private = { ignore = true }
