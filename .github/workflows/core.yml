name: core

on:
  push:
    # dev is here because a merge commit landing on it used to run no workflow
    # at all: dev sat red for a day with the failing test merged and nothing
    # reporting it.
    branches: [main, dev]
    # wire-roster.toml moved to the workspace root when the roster went
    # workspace-wide (issue #32) and stopped being covered by "crates/**".
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", "wire-roster.toml", ".github/workflows/core.yml"]
  pull_request:
    # wire-roster.toml moved to the workspace root when the roster went
    # workspace-wide (issue #32) and stopped being covered by "crates/**".
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "deny.toml", "wire-roster.toml", ".github/workflows/core.yml"]

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Core and Wasm tests
        run: cargo test -p superb-core -p superb-wasm --all-features --locked

      # Long-running behavioural sweeps and report regeneration live in
      # deep-assurance.yml. Library/unit coverage and the source-boundary test
      # stay in the PR lane.
      - name: Fast simulator tests
        run: cargo test -p superb-sim --lib --test oracle_boundary --locked

  licenses:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Licences, bans, sources
        run: cargo deny --locked check licenses bans sources
