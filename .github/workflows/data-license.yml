name: data-license

# The CI gate ADR-008 requires: every content file validates against its
# schema, every slot class passes its substitution test, every passage and
# sourced excerpt passes its structural checks, and data/MANIFEST.md is
# complete with no forbidden licence. data/pipeline/tests/test_check_license_gate.py
# proves check_license_gate.py actually fails on a broken fixture before this
# job ever trusts it to pass on the real tree.

on:
  push:
    # dev, not just main: core.yml already carries this fix (M2 flagged the
    # same gap there) — a merge commit landing on dev used to run no
    # workflow at all, so a failing check could merge and sit red on dev
    # unreported until the next PR into main happened to touch these paths.
    branches: [main, dev]
    paths: ["content/**", "data/MANIFEST.md", "data/pipeline/**", "crates/superb-core/tuning.toml", ".github/workflows/data-license.yml"]
  pull_request:
    paths: ["content/**", "data/MANIFEST.md", "data/pipeline/**", "crates/superb-core/tuning.toml", ".github/workflows/data-license.yml"]

concurrency:
  group: data-license-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: schema, classes, passages, sources, manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install content tooling
        run: pip install -r content/scripts/requirements.txt -r data/pipeline/requirements.txt

      - name: Download nltk's punkt tokenizer (excerpts.py's sentence segmenter)
        run: python -c "import nltk; nltk.download('punkt_tab', quiet=True)"

      - name: Schema — every content file validates (Seam 2)
        run: python content/scripts/validate_schema.py

      - name: Classes — substitution test (30-50 classes, WordNet-checked)
        run: python content/scripts/check_classes.py

      - name: Passages — structural checks (40+, 120-220 words, 5-8 slots)
        run: python content/scripts/check_passages.py

      - name: Sources — structural checks and allow-listed provenance (1500+)
        run: python content/scripts/check_sources.py

      # Issue #67, filed from PR #65's review of issue #58: nothing enforced
      # that content/sources/_seed.py's table stayed in sync with the
      # committed src-*.json files it authors, which is how #58 happened —
      # a bulk fix landed on the JSON directly and the next run of the
      # script would have silently reverted it. Runs the script for real, in
      # a scratch copy of itself so the committed files are never touched,
      # and fails if its output disagrees with what is committed.
      - name: Seed script — content/sources/_seed.py matches what it authors
        run: python content/scripts/check_seed_sync.py

      - name: Prove the licence gate fails on a broken fixture, then run it for real
        run: python data/pipeline/tests/run_all.py

      # ADR-029. The committed word-difficulty table is regenerated here and
      # compared byte for byte, so a word added to a slot class without
      # regenerating fails the build instead of shipping a word the app
      # cannot rank. Also re-checks the mapping's measured claims: every word
      # reachable inside the ability clamp, the ordering still the frequency
      # ordering, and a fresh reader's band big enough to fill a passage.
      # test_difficulty.py and every gloss/excerpt regression are owned by the
      # aggregate command above; keeping a second invocation here would only
      # make one test look more important while silently duplicating work.
