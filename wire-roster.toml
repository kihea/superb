# The roster of every type in the workspace carrying Serialize, Deserialize,
# PartialOrd, or Ord (ADR-016 D3, D4). A serde or ordering derive — or a
# hand-written impl of one of these traits — on a type not listed here does
# not land — crates/superb-core/tests/wire_roster.rs enforces this by parsing
# every .rs file under every workspace member's src/ (the member list itself
# read from `cargo metadata`, not hand-maintained here) and asserting the two
# agree exactly.
#
# This file used to live at crates/superb-core/wire-roster.toml and cover
# superb-core alone (issue #32): the day `superb-wasm` grew its own 11
# serialized types with nobody's default-deny watching them was the day that
# stopped being true, so the roster moved to the workspace root and every
# entry names the crate it governs.
#
# `crate` is the entry's home crate — one of the workspace's own member
# names, matched against `cargo metadata`'s package list, not typed by hand
# against a list this file would have to keep in sync with Cargo.toml itself.
# Two crates are free to declare a type of the same simple name (`Pool` in
# `superb-core`, say, and something unrelated elsewhere); the roster keys on
# (crate, name) together for exactly that reason.
#
# `tier` is `durable` (reachable from the persisted root `LearnerState`,
# authorized by an ADR) or `boundary` (crosses FFI or lands in a committed
# fixture, never persisted, authorized by the brief that introduces it).
# `LearnerState` landed in BRIEF-008; the durable tier is no longer empty.

[[type]]
name = "WordState"
crate = "superb-core"
tier = "durable"
derives = ["Serialize", "Deserialize", "PartialOrd", "Ord"]
consumer = "golden-vector alphabet; crosses WASM, JNI and Swift FFI; a field of WordRecord inside LearnerState"
authorized_by = "BRIEF-001, ADR-016 D4"
note = "durable as of BRIEF-008 — reachable from LearnerState, inside the frozen v1 fixture"

[[type]]
name = "Timestamp"
crate = "superb-core"
tier = "durable"
derives = ["Serialize", "Deserialize"]
consumer = "WordRecord.due_epoch_ms, inside LearnerState"
authorized_by = "ADR-016, BRIEF-008"
note = "field renamed from due to due_epoch_ms in BRIEF-009 (F3) — a v1 shape change made before v1 has ever shipped"

[[type]]
name = "WordRecord"
crate = "superb-core"
tier = "durable"
derives = ["Serialize", "Deserialize"]
consumer = "LearnerState.words, the per-word record"
authorized_by = "ADR-016, BRIEF-008, BRIEF-009, BRIEF-013"
note = "gained interval_days: Option<f64> in BRIEF-009 (ARCHITECT'S ANSWER) — the interval that produced due_epoch_ms, stored rather than derived; None, and absent from the exported document, for a word never scheduled. context_frames changed from Vec<String> to Vec<ContextEncounter> in BRIEF-013 round 3 (ARCHITECT'S ANSWER) — one list now answers both the variation guarantee (every frame_id) and the progression thresholds (only the distinct frame_ids where clean is true), so the two questions cannot disagree. encounters — a separate raw count, not derivable from context_frames — was removed in BRIEF-013 round 4 (review finding F1): it was written on every scheduled encounter and read by nothing in the crate, and a durable field nobody reads is state every future migration has to carry; it returns, defined by a real reader, if something ever needs it"

[[type]]
name = "ContextEncounter"
crate = "superb-core"
tier = "durable"
derives = ["Serialize", "Deserialize"]
consumer = "WordRecord.context_frames, inside LearnerState — one word's one encounter in one context, and whether it was clean"
authorized_by = "BRIEF-013 round 3"

[[type]]
name = "LearnerState"
crate = "superb-core"
tier = "durable"
derives = ["Serialize", "Deserialize"]
consumer = "the persisted root itself (engine-contract §1.5); read by LearnerState::load and written by LearnerState::to_document"
authorized_by = "ADR-016, BRIEF-008"

[[type]]
name = "EnvelopeV1"
crate = "superb-core"
tier = "durable"
derives = ["Serialize"]
consumer = "LearnerState::to_document — pins v and the reader-facing _note as the document's first keys on write (ADR-016 D1). load never deserializes through it; strips both by name instead — see the loader's own doc comment"
authorized_by = "ADR-016, BRIEF-008, BRIEF-009"
note = "BRIEF-009 added the _note field (F3): a fixed, one-sentence explanation of the document for a reader who opened it themselves"

[[type]]
name = "IntervalSet"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize"]
consumer = "engine-contract §3's effect stream — the host persists the due date and re-renders; never reachable from LearnerState, since the interval that produced it is persisted separately in WordRecord.interval_days"
authorized_by = "BRIEF-009, engine-contract §3"

[[type]]
name = "Transition"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "engine-contract §5 golden vectors; the event stream in"
authorized_by = "BRIEF-001, ADR-016 D4"

[[type]]
name = "WordStateChanged"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize"]
consumer = "the expected side of a golden vector; the host persists effects (engine-contract §3)"
authorized_by = "BRIEF-001, ADR-016 D4"

[[type]]
name = "Tuning"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "the simulator overrides tuning.toml wholesale (engine-contract §3); Deserialize also parses the shipped file and Serialize backs the round-trip stability test"
authorized_by = "BRIEF-007"
note = "not reachable from LearnerState; carries no migration obligation"

[[type]]
name = "Affinity"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "nested inside Tuning; same simulator-override and round-trip-test consumer"
authorized_by = "BRIEF-007"
note = "not reachable from LearnerState; carries no migration obligation"

[[type]]
name = "PoolAffinity"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "nested inside Affinity; same simulator-override and round-trip-test consumer"
authorized_by = "BRIEF-007"
note = "not reachable from LearnerState; carries no migration obligation"

[[type]]
name = "Event"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "engine-contract §3's event stream in — the host constructs and sends these across FFI; never reachable from LearnerState"
authorized_by = "BRIEF-011, engine-contract §3"
note = "Signal, this module's output, carries no tracked derive and has no entry here — it is never serialized or persisted in this brief's scope"

[[type]]
name = "Request"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "engine-contract §2's plan/decide pattern — what the host asks the core to do; never reachable from LearnerState"
authorized_by = "BRIEF-013, engine-contract §2"

[[type]]
name = "Needs"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "engine-contract §2 step 1 — what plan() says the host must fetch; serializable so a decision can be replayed from a captured (Needs, Frame) pair; never reachable from LearnerState"
authorized_by = "BRIEF-013, engine-contract §2"

[[type]]
name = "Frame"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "engine-contract §2 step 2 — the host's answer to a Needs; serializable so a decision can be replayed from a captured (Needs, Frame) pair; never reachable from LearnerState"
authorized_by = "BRIEF-013, engine-contract §2"

[[type]]
name = "Effect"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize"]
consumer = "engine-contract §3's effect stream out, unified across the state machine, scheduler, ability estimator, and this module's own context-frame log; the expected side of a golden vector; never reachable from LearnerState"
authorized_by = "BRIEF-013, engine-contract §3"
note = "ProbeEligible is declared for the contract's sake and never constructed in this brief — see BRIEF-013's UNRESOLVED. The ThetaUpdated payload {theta, se} rides here too: it used to be a separate struct in ability.rs with a roster row of its own, which nothing constructed, so the shape being checked was not the shape being shipped (BRIEF-010, engine-contract §3)"

[[type]]
name = "Outcome"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize"]
consumer = "what decide() returns — an ordered list of Effect; order is part of the contract a golden vector compares byte-exactly; never reachable from LearnerState"
authorized_by = "BRIEF-013, engine-contract §2"

[[type]]
name = "Pool"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize", "Deserialize", "PartialOrd", "Ord"]
consumer = "which of ADR-009's two pools a candidate or a chosen passage is drawn from; crosses FFI inside Candidate and Passage; never reachable from LearnerState"
authorized_by = "ADR-009, ADR-015, engine-contract §4"
note = "Ord is derived so a candidate list has a total order independent of the score — the composer's tiebreaks are on id, but a stable Pool ordering keeps any future grouping deterministic too"

[[type]]
name = "Slot"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "one fillable position in a composed template, inside Candidate — the host reads it out of its content index and hands it over; never reachable from LearnerState"
authorized_by = "engine-contract §4, ADR-015"

[[type]]
name = "Candidate"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "one passage the host offers for a NextPassage request, inside ContentFrame; serializable so a composer decision replays byte for byte from a captured (Needs, Frame) pair"
authorized_by = "engine-contract §2, §4"

[[type]]
name = "SlotFill"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "what stands in one slot of the passage the host renders, inside Passage"
authorized_by = "engine-contract §4"

[[type]]
name = "Passage"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "the composer's output, carried by Effect::PassageComposed — the host renders it and reports its id back as a frame_id on PassageFinished; never reachable from LearnerState, because nothing is recorded until the reader actually meets the passage"
authorized_by = "engine-contract §3, §4, ADR-015"

[[type]]
name = "ContentFrame"
crate = "superb-core"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "the reference-data half of engine-contract §2's Frame — candidates plus the word-class table, fetched by the host in answer to Needs::PassageCandidates"
authorized_by = "engine-contract §2, §4"

[[type]]
name = "TopicRecord"
crate = "superb-core"
tier = "durable"
derives = ["Serialize", "Deserialize"]
consumer = "LearnerState.topic_affinities — what one reader has done with one topic, two counts rather than a rate so the exploration bonus has a denominator to read (ADR-022 D1, D3)"
authorized_by = "ADR-022"
note = "replaces the bare f64 the field carried since BRIEF-008, which was written by nothing; a durable shape change made before v1 has ever shipped, the same licence BRIEF-009's field rename used"

# ── superb-wasm/src/wire.rs — the seam's own camelCase mirror (issue #32) ──
# Every one of these translates one direction only (host to core, or core to
# host — see wire.rs's own module doc), so each derives only the serde half
# it actually uses; none of them are reachable from LearnerState, and none
# carry a migration obligation — they exist for exactly as long as one
# wasm-bindgen call.

[[type]]
name = "WireRequest"
crate = "superb-wasm"
tier = "boundary"
derives = ["Deserialize"]
consumer = "docs/seams.md's Request — the host's ProcessEvent/NextPassage call, decoded off the JS boundary and converted into core_engine::Request"
authorized_by = "docs/seams.md Seam 1, ADR-016 D4"

[[type]]
name = "WireEvent"
crate = "superb-wasm"
tier = "boundary"
derives = ["Deserialize"]
consumer = "docs/seams.md's Event — decoded off the JS boundary; screen/words renamed from screen_id/words_on_screen at the translation, not asked of every host"
authorized_by = "docs/seams.md Seam 1, ADR-016 D4"

[[type]]
name = "WireFrame"
crate = "superb-wasm"
tier = "boundary"
derives = ["Deserialize"]
consumer = "docs/seams.md's Frame — the host's answer to a Needs, including Topics (ADR-022, the seam's 2026-07-25 amendment)"
authorized_by = "docs/seams.md Seam 1, ADR-022"

[[type]]
name = "WireContentFrame"
crate = "superb-wasm"
tier = "boundary"
derives = ["Deserialize"]
consumer = "docs/seams.md's ContentFrame, nested inside WireFrame::Content"
authorized_by = "docs/seams.md Seam 1"

[[type]]
name = "WireCandidate"
crate = "superb-wasm"
tier = "boundary"
derives = ["Deserialize"]
consumer = "docs/seams.md's Candidate, topics included — composer::taste_multiplier reads it for ADR-022's real scoring"
authorized_by = "docs/seams.md Seam 1, ADR-022"

[[type]]
name = "WireSlot"
crate = "superb-wasm"
tier = "boundary"
derives = ["Deserialize"]
consumer = "docs/seams.md's Candidate.slots[] entry"
authorized_by = "docs/seams.md Seam 1"

[[type]]
name = "WirePool"
crate = "superb-wasm"
tier = "boundary"
derives = ["Serialize", "Deserialize"]
consumer = "docs/seams.md's Pool — the only wire type in this file that crosses both directions, since a Pool arrives on a Candidate and leaves again on a Passage"
authorized_by = "docs/seams.md Seam 1"

[[type]]
name = "WireNeeds"
crate = "superb-wasm"
tier = "boundary"
derives = ["Serialize"]
consumer = "docs/seams.md's Needs — what plan() asks the host to fetch, including PassageTopics (ADR-022)"
authorized_by = "docs/seams.md Seam 1, ADR-022"

[[type]]
name = "WireEffect"
crate = "superb-wasm"
tier = "boundary"
derives = ["Serialize"]
consumer = "docs/seams.md's Effect, including TopicAffinityUpdated — crosses the boundary and is never rendered (wire.rs's own doc comment); this crate's job stops at binding it faithfully"
authorized_by = "docs/seams.md Seam 1, ADR-022"

[[type]]
name = "WirePassage"
crate = "superb-wasm"
tier = "boundary"
derives = ["Serialize"]
consumer = "docs/seams.md's Passage, topics included, carried by WireEffect::PassageComposed"
authorized_by = "docs/seams.md Seam 1, ADR-022"

[[type]]
name = "WireSlotFill"
crate = "superb-wasm"
tier = "boundary"
derives = ["Serialize"]
consumer = "docs/seams.md's Passage.fills[] entry"
authorized_by = "docs/seams.md Seam 1"
