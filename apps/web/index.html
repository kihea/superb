<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The real brand mark (brand/out/identity/icons/, private root),
         replacing a placeholder dark "wings" glyph this build carried
         before it existed. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- #F6EFE4 matches the manifest's own theme_color below (vite.config.ts)
         -- the paper the app actually opens on, not the dark room the old
         placeholder icon's own background colour described. -->
    <meta name="theme-color" content="#F6EFE4" />
    <title>Superb</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
